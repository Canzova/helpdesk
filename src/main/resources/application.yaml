spring:
  application:
    name: chat-support-helpdesk

# We are using a mysql supported maridb version
  datasource:
    url: jdbc:mariadb://localhost:3306/helpdesk-ai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
#    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        model: gpt-4o-mini
    vectorstore:
      mariadb:
        initialize-schema: true
        distance-type: COSINE
        dimensions: 1536
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always


logging:
  level:
    "org.springframework.ai.chat.client.advisor": DEBUG
    "org.springframework.ai.vectorstore": DEBUG
    "org.springframework.ai.rag": DEBUG


